{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>Mis solicitudes</h2>
  <table>
    <tr><th>Nombre</th><th>Unidad</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr>
    {% for s in solicitudes %}
    <tr>
      <td>{{ s.nombre }}</td>
      <td>{{ s.unidad_responsable }}</td>
      <td><span class="badge">{{ s.get_estado_display }}</span></td>
      <td>{{ s.creado_en|date:"d/m/Y" }}</td>
      <td>
        <a href="/solicitudes/{{ s.pk }}/">Ver</a> |
        <a href="/solicitudes/{{ s.pk }}/pdf/">PDF</a>
      </td>
    </tr>
    {% empty %}<tr><td colspan="5">Sin solicitudes.</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
